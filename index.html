<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR Industries | Financial Innovation & Growth</title>
<link rel="stylesheet" href="output.css"><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
:root{--navy:#020912;--blue:#0d47a1;--cyan:#00b4d8;--accent:#00e5ff;--silver:#cfd8dc;--white:#fff;--green:#4caf50;--red:#ef5350;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--silver);overflow-x:hidden;}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:10px 50px;background:rgba(2,9,18,.97);backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,229,255,.15);}
.nav-brand{display:flex;align-items:center;gap:14px;text-decoration:none;}
.nav-logo-img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(0,229,255,.8));border-radius:50%;border:1px solid rgba(0,229,255,.2);}
.brand-text .name{font-family:'Orbitron',monospace;font-size:17px;font-weight:700;letter-spacing:3px;color:var(--white);display:block;}
.brand-text .sub{font-size:9px;letter-spacing:2.5px;color:var(--cyan);text-transform:uppercase;}
.nav-tabs{display:flex;gap:4px;list-style:none;align-items:center;}
.nav-tabs li a,.nav-tabs li button{text-decoration:none;color:rgba(207,216,220,.65);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:all .3s;padding:8px 14px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-tabs li a:hover,.nav-tabs li button:hover{color:var(--accent);background:rgba(0,229,255,.06);}
.nav-tabs li a.active,.nav-tabs li button.active{color:var(--accent);background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);}
.nav-cta{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:9px 22px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif;}
.nav-cta:hover{background:var(--accent);color:var(--navy);box-shadow:0 0 30px rgba(0,229,255,.4);}

/* ── TICKER ── */
.ticker{position:fixed;top:72px;left:0;right:0;z-index:499;background:rgba(2,9,18,.99);border-top:1px solid rgba(0,229,255,.2);border-bottom:1px solid rgba(0,229,255,.2);padding:7px 0;overflow:hidden;box-shadow:0 4px 20px rgba(0,229,255,.05);}
.ttrack{display:flex;gap:36px;width:max-content;animation:scrolll 40s linear infinite;}
@keyframes scrolll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.ti{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;white-space:nowrap;}
.tp{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1.5px;color:rgba(0,229,255,.7);}
.tv{color:var(--white);font-family:'Orbitron',monospace;font-size:10px;letter-spacing:.5px;}
.tup{color:#4caf50;}.tdn{color:#ef5350;}.tsep{color:rgba(0,229,255,.3);margin:0 8px;font-size:14px;}

/* ── PAGES ── */
.page{display:none;position:relative;z-index:1;min-height:100vh;padding-top:130px;}
.page.active{display:block;}

/* ── HOME PAGE ── */
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:30px 60px 80px;gap:40px;min-height:90vh;}
.hero-symbol{display:flex;justify-content:center;align-items:center;position:relative;}
.cr-wrap{position:relative;width:440px;height:440px;display:flex;align-items:center;justify-content:center;}
.cr-ring{position:absolute;border-radius:50%;border:1px solid rgba(0,229,255,.12);}
.r1{inset:0;animation:spin-cw 25s linear infinite;}
.r2{inset:30px;border-style:dashed;border-color:rgba(0,180,216,.08);animation:spin-ccw 18s linear infinite;}
.r3{inset:60px;animation:spin-cw 32s linear infinite;border-color:rgba(0,229,255,.05);}
@keyframes spin-cw{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spin-ccw{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.od{position:absolute;width:440px;height:440px;top:50%;left:50%;margin:-220px 0 0 -220px;}
.od::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent),0 0 20px rgba(0,229,255,.5);top:0;left:50%;margin-left:-3px;}
.od1{animation:spin-cw 8s linear infinite;}
.od2{animation:spin-ccw 12s linear infinite;}.od2::after{background:var(--cyan);}
.od3{animation:spin-cw 16s linear infinite 2s;}.od3::after{width:4px;height:4px;opacity:.5;}
.cf{position:absolute;z-index:5;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:rgba(0,229,255,.5);text-shadow:0 0 10px rgba(0,229,255,.4);}
.cf1{top:20px;left:90px;animation:fly 4s ease-in-out infinite 0s;}
.cf2{top:50px;right:55px;animation:fly 4s ease-in-out infinite .7s;}
.cf3{bottom:50px;left:42px;animation:fly 4s ease-in-out infinite 1.4s;}
.cf4{bottom:20px;right:90px;animation:fly 4s ease-in-out infinite 2.1s;}
.cf5{top:50%;left:8px;margin-top:-10px;animation:fly 4s ease-in-out infinite 2.8s;}
.cf6{top:50%;right:14px;margin-top:-10px;animation:fly 4s ease-in-out infinite 3.5s;}
@keyframes fly{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-12px);opacity:1;}}
.pc{position:absolute;z-index:8;background:rgba(2,9,18,.92);border:1px solid rgba(0,229,255,.2);border-radius:10px;padding:10px 16px;backdrop-filter:blur(14px);font-size:12px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.4);min-width:120px;}
.pc1{top:24px;left:-22px;animation:fly 5s ease-in-out infinite 0s;}
.pc2{top:52px;right:-28px;animation:fly 5s ease-in-out infinite 1s;}
.pc3{bottom:62px;left:-28px;animation:fly 5s ease-in-out infinite 2s;}
.pc4{bottom:32px;right:-18px;animation:fly 5s ease-in-out infinite 3s;}
.pc-pair{color:rgba(207,216,220,.6);font-size:10px;letter-spacing:1px;margin-bottom:3px;}
.pc-val{color:var(--white);font-family:'Orbitron',monospace;font-size:13px;}
.pc-chg{font-size:11px;font-weight:700;margin-top:2px;}
.up{color:#4caf50;}.dn{color:#ef5350;}
@keyframes flash-g{0%,100%{background:transparent;}40%{background:rgba(76,175,80,.15);}}
@keyframes flash-r{0%,100%{background:transparent;}40%{background:rgba(239,83,80,.12);}}
.fg{animation:flash-g .5s ease;}.fr{animation:flash-r .5s ease;}
.cr-hex{position:relative;z-index:10;width:220px;height:220px;}
.cr-hex svg{width:220px;height:220px;filter:drop-shadow(0 0 28px rgba(0,229,255,.55)) drop-shadow(0 0 60px rgba(0,180,216,.3));}
.hero-text{}
.eyebrow{display:inline-flex;align-items:center;gap:10px;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.18);border-radius:50px;padding:6px 18px;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:26px;}
.ldot{width:7px;height:7px;border-radius:50%;background:#f44336;box-shadow:0 0 8px #f44336;animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
h1.htitle{font-family:'Orbitron',monospace;font-size:clamp(38px,4.5vw,72px);font-weight:900;line-height:.94;letter-spacing:2px;margin-bottom:26px;}
.ht1{display:block;color:var(--white);}
.ht2{display:block;background:linear-gradient(135deg,var(--cyan),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ht3{display:block;color:transparent;-webkit-text-stroke:1px rgba(0,229,255,.3);}
.hdesc{font-size:15px;line-height:1.8;color:rgba(207,216,220,.75);max-width:480px;margin-bottom:40px;}
.hbtns{display:flex;gap:14px;flex-wrap:wrap;}
.btnp{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--white);padding:14px 30px;border-radius:4px;text-decoration:none;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;transition:all .3s;box-shadow:0 8px 32px rgba(0,180,216,.3);cursor:pointer;border:none;font-family:'Inter',sans-serif;}
.btnp:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(0,229,255,.4);}
.btno{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--silver);padding:14px 30px;border-radius:4px;text-decoration:none;font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(207,216,220,.2);transition:all .3s;cursor:pointer;font-family:'Inter',sans-serif;}
.btno:hover{border-color:var(--accent);color:var(--accent);}
.hmstats{display:flex;gap:36px;margin-top:44px;}
.hms{border-left:2px solid rgba(0,229,255,.3);padding-left:14px;}
.hmsn{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--white);}
.hmsn span{color:var(--accent);}
.hmsl{font-size:9px;letter-spacing:2px;color:rgba(207,216,220,.45);text-transform:uppercase;margin-top:2px;}

/* ── STATS BAND ── */
.sband{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid rgba(0,229,255,.05);border-top:1px solid rgba(0,229,255,.05);}
.sc{padding:32px;text-align:center;border-right:1px solid rgba(0,229,255,.04);transition:background .4s;position:relative;overflow:hidden;}
.sc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transition:transform .4s;}
.sc:hover{background:rgba(0,229,255,.03);}.sc:hover::after{transform:scaleX(1);}
.sn{font-family:'Orbitron',monospace;font-size:40px;font-weight:900;color:var(--white);line-height:1;}
.sn em{color:var(--accent);font-style:normal;}
.sl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(207,216,220,.4);margin-top:8px;}

/* ── SECTION SHARED ── */
.sec{position:relative;z-index:1;padding:80px 60px;}
.sec-alt{background:rgba(5,12,25,.7);}
.stag{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.stag::before{content:'';width:22px;height:1px;background:var(--accent);}
.stitle{font-family:'Orbitron',monospace;font-size:clamp(26px,3.5vw,44px);font-weight:900;color:var(--white);letter-spacing:2px;margin-bottom:14px;line-height:1.05;}
.ssub{font-size:14px;line-height:1.8;color:rgba(207,216,220,.6);max-width:520px;margin-bottom:48px;}

/* ── MARKETS MINI CARDS (home) ── */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.mcard{background:rgba(5,15,30,.8);border:1px solid rgba(0,229,255,.07);border-radius:12px;padding:24px;transition:all .4s;position:relative;overflow:hidden;}
.mcard::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(0,229,255,.05),transparent 60%);opacity:0;transition:opacity .4s;}
.mcard::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .4s;}
.mcard:hover{border-color:rgba(0,229,255,.2);transform:translateY(-6px);box-shadow:0 24px 60px rgba(0,0,0,.5);}.mcard:hover::before,.mcard:hover::after{opacity:1;}
.mico{font-size:28px;margin-bottom:12px;display:block;}
.mcard h3{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--white);margin-bottom:8px;letter-spacing:1px;}
.mcard p{font-size:12px;color:rgba(207,216,220,.6);line-height:1.65;}
.mpill{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:3px;background:rgba(0,229,255,.07);color:var(--accent);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(0,229,255,.12);}

/* ── WHY US ── */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:rgba(0,229,255,.04);border-radius:16px;overflow:hidden;}
.wc{background:rgba(2,9,18,.98);padding:40px;transition:background .3s;}
.wc:hover{background:rgba(5,15,30,.98);}
.wico{width:46px;height:46px;border-radius:10px;margin-bottom:16px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.14);display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .3s;}
.wc:hover .wico{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.3);}
.wc h3{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--white);margin-bottom:8px;letter-spacing:1px;}
.wc p{font-size:13px;color:rgba(207,216,220,.6);line-height:1.65;}

/* ── IB ── */
.ibsec{position:relative;z-index:1;padding:80px 60px;background:linear-gradient(135deg,rgba(13,71,161,.06),rgba(0,229,255,.03));border-top:1px solid rgba(0,229,255,.05);border-bottom:1px solid rgba(0,229,255,.05);}
.ibinner{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
.ibsteps{display:flex;flex-direction:column;gap:18px;}
.ibstep{display:flex;gap:16px;align-items:flex-start;padding:18px;border-radius:10px;border:1px solid transparent;transition:all .3s;}
.ibstep:hover{background:rgba(0,229,255,.03);border-color:rgba(0,229,255,.1);}
.snum{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:13px;font-weight:900;color:var(--white);box-shadow:0 0 20px rgba(0,229,255,.3);}
.ibstep h4{font-size:14px;font-weight:600;color:var(--white);margin-bottom:4px;}
.ibstep p{font-size:13px;color:rgba(207,216,220,.55);line-height:1.5;}
.ib-right{}
.ib-earn{background:rgba(5,15,30,.9);border:1px solid rgba(0,229,255,.12);border-radius:16px;padding:36px;}
.ib-earn h3{font-family:'Orbitron',monospace;font-size:16px;color:var(--white);margin-bottom:24px;letter-spacing:1px;}
.ib-tier{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(0,229,255,.06);}
.ib-tier:last-child{border:none;}
.ib-tier-label{font-size:12px;color:rgba(207,216,220,.6);}
.ib-tier-val{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;color:var(--accent);}
.ib-cta-block{margin-top:24px;text-align:center;}

/* ── COMMUNITY ── */
.socgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:840px;margin:0 auto;}
.socc{background:rgba(5,15,30,.8);border:1px solid rgba(0,229,255,.07);border-radius:12px;padding:24px 32px;display:flex;align-items:center;gap:14px;transition:all .3s;text-decoration:none;min-width:200px;}
.socc:hover{border-color:rgba(0,229,255,.25);transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.4);}
.socc-ico{font-size:28px;}
.socc-info .socc-name{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--white);margin-bottom:4px;letter-spacing:1px;}
.socc-info .socc-count{font-size:11px;color:rgba(207,216,220,.5);}

/* ── INVESTMENT PLANS ── */
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:0 auto;}
.plan-card{background:rgba(5,15,30,.8);border:1px solid rgba(0,229,255,.08);border-radius:16px;padding:36px 28px;text-align:center;position:relative;transition:all .4s;overflow:hidden;}
.plan-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .4s;}
.plan-card:hover{border-color:rgba(0,229,255,.22);transform:translateY(-8px);box-shadow:0 28px 70px rgba(0,0,0,.5);}.plan-card:hover::before{opacity:1;}
.plan-card.featured{border-color:rgba(0,229,255,.3);background:rgba(0,50,80,.3);}
.plan-card.featured::before{opacity:1;background:linear-gradient(90deg,transparent,var(--cyan),transparent);}
.plan-badge{position:absolute;top:-1px;right:20px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--white);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:0 0 8px 8px;}
.plan-icon{font-size:36px;margin-bottom:16px;display:block;}
.plan-name{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--white);margin-bottom:6px;letter-spacing:2px;}
.plan-min{font-size:11px;letter-spacing:2px;color:rgba(207,216,220,.45);text-transform:uppercase;margin-bottom:24px;}
.plan-roi{font-family:'Orbitron',monospace;font-size:46px;font-weight:900;color:var(--accent);line-height:1;}
.plan-roi-sub{font-size:11px;color:rgba(207,216,220,.45);letter-spacing:1px;margin-bottom:24px;margin-top:4px;}
.plan-features{list-style:none;text-align:left;margin-bottom:28px;display:flex;flex-direction:column;gap:10px;}
.plan-features li{font-size:12px;color:rgba(207,216,220,.7);display:flex;align-items:center;gap:8px;}
.plan-features li::before{content:'✓';color:var(--accent);font-weight:700;font-size:14px;flex-shrink:0;}
.plan-btn{width:100%;padding:13px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif;border:1px solid rgba(0,229,255,.3);background:transparent;color:var(--accent);}
.plan-btn:hover,.plan-card.featured .plan-btn{background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--white);border-color:transparent;box-shadow:0 8px 28px rgba(0,229,255,.3);}

/* ── MARKETS PAGE ── */
.markets-page{padding:30px 40px 60px;}
.markets-header{margin-bottom:30px;}
.tv-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:28px;}
.tv-widget-wrap{background:rgba(5,15,30,.9);border:1px solid rgba(0,229,255,.1);border-radius:12px;overflow:hidden;}
.tv-widget-wrap iframe{display:block;}
.market-table-wrap{background:rgba(5,15,30,.9);border:1px solid rgba(0,229,255,.1);border-radius:12px;overflow:hidden;width:100%;}
.mt-header{padding:22px 28px;border-bottom:1px solid rgba(0,229,255,.1);display:flex;align-items:center;justify-content:space-between;background:rgba(0,229,255,.02);}
.mt-header h3{font-family:'Orbitron',monospace;font-size:16px;letter-spacing:2px;color:var(--white);}
.mt-live{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--accent);letter-spacing:1px;}
.mt-live-dot{width:6px;height:6px;border-radius:50%;background:#4caf50;box-shadow:0 0 6px #4caf50;animation:blink 1.4s infinite;}
.market-table{width:100%;border-collapse:collapse;}
.market-table th{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(207,216,220,.4);padding:16px 28px;text-align:left;border-bottom:1px solid rgba(0,229,255,.07);font-weight:700;}
.market-table td{padding:18px 28px;font-size:15px;border-bottom:1px solid rgba(0,229,255,.04);}
.market-table tr:last-child td{border:none;}
.market-table tr:hover td{background:rgba(0,229,255,.03);}
.mts-pair{font-family:'Orbitron',monospace;font-size:13px;color:var(--white);letter-spacing:2px;font-weight:700;}
.mts-price{font-family:'Orbitron',monospace;font-size:17px;color:var(--white);font-weight:700;}
.mts-chg{font-size:15px;font-weight:700;padding:4px 12px;border-radius:4px;}
.mts-chg.up{color:#4caf50;background:rgba(76,175,80,.08);}.mts-chg.dn{color:#ef5350;background:rgba(239,83,80,.08);}
.tv-bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

/* ── WHY US PAGE ── */
.whyus-hero{background:linear-gradient(135deg,rgba(13,71,161,.12),rgba(0,229,255,.04));padding:70px 60px;text-align:center;border-bottom:1px solid rgba(0,229,255,.06);}
.why-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:60px;}
.why-card{background:rgba(5,15,30,.8);border:1px solid rgba(0,229,255,.08);border-radius:14px;padding:36px 28px;text-align:center;transition:all .4s;}
.why-card:hover{border-color:rgba(0,229,255,.2);transform:translateY(-6px);box-shadow:0 24px 60px rgba(0,0,0,.5);}
.why-ico{width:60px;height:60px;border-radius:14px;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.15);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px;transition:all .4s;}
.why-card:hover .why-ico{background:rgba(0,229,255,.13);border-color:rgba(0,229,255,.35);box-shadow:0 0 30px rgba(0,229,255,.15);}
.why-card h3{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--white);margin-bottom:12px;letter-spacing:1px;}
.why-card p{font-size:13px;color:rgba(207,216,220,.6);line-height:1.7;}
.why-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(0,229,255,.04);margin:0 60px 60px;border-radius:12px;overflow:hidden;}
.why-stat{background:rgba(5,15,30,.95);padding:36px;text-align:center;}
.why-stat-num{font-family:'Orbitron',monospace;font-size:36px;font-weight:900;color:var(--accent);}
.why-stat-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(207,216,220,.4);margin-top:6px;}

/* ── MODAL / OVERLAY ── */
.modal-overlay{position:fixed;inset:0;background:rgba(2,9,18,.88);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:rgba(5,15,30,.98);border:1px solid rgba(0,229,255,.15);border-radius:16px;padding:48px;max-width:480px;width:90%;position:relative;}
.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:rgba(207,216,220,.4);font-size:22px;cursor:pointer;transition:color .3s;}
.modal-close:hover{color:var(--accent);}
.modal h2{font-family:'Orbitron',monospace;font-size:20px;color:var(--white);margin-bottom:6px;letter-spacing:2px;}
.modal-sub{font-size:12px;color:rgba(207,216,220,.5);margin-bottom:28px;letter-spacing:1px;}
.form-group{margin-bottom:18px;}
.form-group label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(207,216,220,.5);display:block;margin-bottom:6px;}
.form-group input,.form-group select{width:100%;background:rgba(2,9,18,.8);border:1px solid rgba(0,229,255,.12);border-radius:6px;padding:11px 14px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;transition:border .3s;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:rgba(0,229,255,.35);}
.form-group select option{background:var(--navy);}
.form-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:4px;color:var(--white);font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .3s;}
.form-submit:hover{box-shadow:0 10px 36px rgba(0,229,255,.4);transform:translateY(-1px);}

/* ── FOOTER ── */
footer{position:relative;z-index:1;padding:44px 60px;border-top:1px solid rgba(0,229,255,.07);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;background:rgba(2,9,18,.98);}
.fbrand{display:flex;align-items:center;gap:12px;}
.flogo{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,229,255,.5));border-radius:50%;}
.fbt .fn{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:2px;color:#fff;display:block;}
.fbt .fs{font-size:9px;letter-spacing:2px;color:#00b4d8;text-transform:uppercase;}
.flinks{list-style:none;display:flex;gap:24px;flex-wrap:wrap;}
.flinks a{text-decoration:none;font-size:11px;letter-spacing:1.5px;color:rgba(207,216,220,.45);transition:color .3s;text-transform:uppercase;}
.flinks a:hover{color:var(--accent);}
.fcopy{font-size:11px;color:rgba(207,216,220,.25);letter-spacing:1px;}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s;}
.reveal.visible{opacity:1;transform:translateY(0);}

/* ══════════════════════════════════════════════
   RESPONSIVE DESIGN — HAMBURGER MENU
══════════════════════════════════════════════ */
.hamburger{display:none;flex-direction:column;justify-content:center;align-items:center;width:42px;height:42px;cursor:pointer;border:1px solid rgba(0,229,255,.2);border-radius:6px;background:transparent;gap:5px;z-index:600;flex-shrink:0;}
.hamburger span{display:block;width:20px;height:2px;background:var(--accent);border-radius:2px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

/* Mobile nav overlay */
.nav-mobile{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:499;background:rgba(2,9,18,.98);padding:100px 24px 40px;flex-direction:column;gap:12px;overflow-y:auto;}
.nav-mobile.open{display:flex;}
.nav-mobile li{list-style:none;}
.nav-mobile li button{width:100%;text-align:left;color:rgba(207,216,220,.75);font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:14px 20px;border-radius:6px;border:1px solid rgba(0,229,255,.08);background:rgba(0,229,255,.03);cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif;}
.nav-mobile li button.active,.nav-mobile li button:hover{color:var(--accent);background:rgba(0,229,255,.08);border-color:rgba(0,229,255,.25);}
.nav-mobile .nav-cta-mobile{margin-top:16px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;color:var(--white);padding:14px 24px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;width:100%;}
